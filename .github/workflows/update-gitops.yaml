name: Update GitOps

on:
  workflow_call:
    inputs:
      version:
        description: 'Image version'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version'
        required: true
        type: string
      environment:
        description: 'Environment'
        required: false
        type: choice
        options:
          - ""
          - dev
          - bluegreen
        default: ""

jobs:
  update-gitops:
    runs-on: ubuntu-latest
    env:
      RETRIES: 5
      BRANCH: rollouts
      VALUES_FILE: brsp/values.yaml
      TAG_PARENT_KEY: .next.image.tag
      IMAGE_TAG: ${{ github.event.inputs.version }}
      ENVIRONMENT: ${{ github.event.inputs.environment }}
    steps:

    - name: Set environment
      run: |
        [ -z "${{ github.event.inputs.environment }}" ] &&
        echo "ENVIRONMENT=$([[ ${{ github.ref }} == 'refs/heads/dev' ]] && echo dev || echo bluegreen)" >> "$GITHUB_ENV"

    - name: Set image tag
      run: echo "IMAGE_TAG=$([[ ${{ github.ref }} == 'refs/heads/dev' ]] && echo dev-)$IMAGE_TAG" >> "$GITHUB_ENV"

    - name: Check out the gitops repo
      uses: actions/checkout@v4
      with:
        repository: ${{ secrets.GITOPS_REPO }}
        ref: ${{ env.BRANCH }}
        ssh-key: ${{ secrets.GITOPS_SSH_KEY }}

    - name: Update image tag
      uses: mikefarah/yq@master
      with:
        cmd: yq -i '${{ env.TAG_PARENT_KEY }}.${{ env.ENVIRONMENT }} = "${{ env.IMAGE_TAG }}"' "${{ env.VALUES_FILE }}"

    - name: Push possible changes
      run: |
        set -e

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git add "$VALUES_FILE"
        git commit -m "chore(gitops): update $TAG_PARENT_KEY.$ENVIRONMENT to $IMAGE_TAG" || exit 0

        n=0
        until [ $n -ge $RETRIES ]
        do
          git pull --rebase origin "$BRANCH" || git rebase --abort
          if git push origin "$BRANCH"; then
            echo "Push succeeded"
            break
          fi
          n=$((n+1))
          echo "Push failed, retrying ($n)..."
          sleep 2
        done

        if [ $n -ge 5 ]; then
          echo "Push failed after $RETRIES retries"
          exit 1
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
